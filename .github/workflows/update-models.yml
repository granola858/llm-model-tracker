name: Propose New Models (PR)

on:
  # 每天台灣時間 09:30 檢查一次是否有新模型發布
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# 預設不給權限，每個 job 只拿自己需要的。
# 安裝 npm 套件、呼叫 Claude、建置只在唯讀的 review job 執行，第三方程式碼拿不到寫入權限。
permissions: {}

concurrency:
  group: 'update-models'
  cancel-in-progress: false

env:
  PR_BRANCH: bot/model-updates

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      added: ${{ steps.fetch.outputs.added }}
      changed: ${{ steps.collect.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 上一次提出的 PR 還沒處理時先不跑，避免覆蓋待審內容、也不重複花 API 費用
      - name: Skip if a model-update PR is still open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then
            echo "::notice::已有待審的模型更新 PR，這次跳過。"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.open == '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.open == '0'
        run: npm ci

      - name: Find and review new models with Claude
        if: steps.guard.outputs.open == '0'
        id: fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_UPDATE_SUMMARY: ${{ runner.temp }}/review/model-update.md
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          npm run fetch-models

      - name: Validate models.json and type-check
        if: steps.guard.outputs.open == '0'
        run: |
          npm run validate-models
          npm run build

      # 審核結果交給 publish job 寫回 repo
      - name: Collect review results
        if: steps.guard.outputs.open == '0'
        id: collect
        run: |
          if git diff --quiet -- src/data/models.json scripts/state/reviewed-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp src/data/models.json scripts/state/reviewed-candidates.json "$RUNNER_TEMP/review/"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload review results
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-review
          path: ${{ runner.temp }}/review/
          retention-days: 1
          if-no-files-found: error

  # 只搬運 review job 的結果，不裝套件、不執行 repo 內的程式碼
  publish:
    needs: review
    if: needs.review.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download review results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-review
          path: ${{ runner.temp }}/review

      # 已審過的候選清單直接進 main，下次不會再送審。
      # 這時工作目錄只有這個檔案有變動，git pull --rebase 才不會因為未 commit 的 models.json 失敗
      - name: Commit reviewed-candidate state to main
        run: |
          cp "$RUNNER_TEMP/review/reviewed-candidates.json" scripts/state/reviewed-candidates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/state/reviewed-candidates.json
          if git diff --staged --quiet; then
            echo "No reviewed-candidate changes."
          else
            git commit -m "chore(models): 記錄已審核的候選模型 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Apply proposed models
        if: needs.review.outputs.added != '0'
        run: cp "$RUNNER_TEMP/review/models.json" src/data/models.json

      - name: Open pull request with new models
        if: needs.review.outputs.added != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.PR_BRANCH }}
          base: main
          add-paths: src/data/models.json
          commit-message: 'feat(data): 自動提出 ${{ needs.review.outputs.added }} 筆新模型'
          title: '新增 ${{ needs.review.outputs.added }} 筆模型（自動查證，待審核）'
          body-path: ${{ runner.temp }}/review/model-update.md
          delete-branch: true
