name: Auto Update AI News & Deploy to GitHub Pages

on:
  # 1. 當推送至 main 分支時自動建置並部署
  push:
    branches:
      - main
  # 2. 每 6 小時自動抓取最新 AI 新聞 RSS 並重新部署靜態頁面
  schedule:
    - cron: '0 */6 * * *'
  # 3. 允許在 GitHub Actions 頁面手動一鍵觸發
  workflow_dispatch:

# 預設不給權限，每個 job 只拿自己需要的。
# 安裝 npm 套件與建置只在唯讀的 build job 執行，第三方程式碼拿不到寫入權限。
permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 只跑 repo 自己的腳本、不裝 npm 套件，所以可以給 push 權限
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Fetch latest AI News into public/data/news.json
        run: npm run fetch-news

      - name: Commit updated news.json back to repository (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore(news): 自動更新最新 AI 產業新聞動態 [skip ci]"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update-news
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-news.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate models.json
        run: npm run validate-models

      - name: Build static frontend (Vite)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  # 只部署已建好的產物，不 checkout、不執行任何 repo 內的程式碼
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
