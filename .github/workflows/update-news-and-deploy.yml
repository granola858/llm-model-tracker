name: Auto Update AI News & Deploy to GitHub Pages

on:
  # 1. 當推送至 main 分支時自動建置並部署
  push:
    branches:
      - main
  # 2. 每 6 小時自動抓取最新 AI 新聞 RSS 並重新部署靜態頁面
  schedule:
    - cron: '0 */6 * * *'
  # 3. 允許在 GitHub Actions 頁面手動一鍵觸發
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-news-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest AI News into public/data/news.json
        run: npm run fetch-news

      - name: Commit updated news.json back to repository (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore(news): 自動更新最新 AI 產業新聞動態 [skip ci]"
            git push
          fi

      - name: Build static frontend (Vite)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
